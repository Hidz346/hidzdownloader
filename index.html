<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidz | Downloader</title>
    <link rel="icon" type="image/png" href="https://www.gobox.my.id/file/IcHjU.png">
    <!-- Dependencies: Axios & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #060608;
            --surface: #0d0d12;
            --surface2: #13131a;
            --lime: #c8ff00;
            --lime-glow: rgba(200, 255, 0, 0.18);
            --purple: #7c3aed;
            --purple-glow: rgba(124, 58, 237, 0.25);
            --border: rgba(200, 255, 0, 0.18);
            --border-strong: rgba(200, 255, 0, 0.45);
            --text: #e8e8f0;
            --text-dim: #6b7280;
            --shadow: 0 0 0 1px rgba(200,255,0,0.12), 0 8px 40px rgba(0,0,0,0.7), 4px 4px 0px rgba(200,255,0,0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-weight: 700;
        }

        body {
            background-color: var(--bg);
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
            color: var(--text);
        }

        /* Galaxy Background dari getcodr.html */
        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 20% 10%, #0c0032 0%, #00000a 45%, #000000 100%);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.7; }
        }

        .planet {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
        }

        .planet1 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #4a0e0e);
            top: 10%;
            right: 10%;
            animation: float 20s infinite ease-in-out;
            box-shadow: 0 0 60px rgba(255, 100, 100, 0.15), 0 0 120px rgba(255,50,50,0.06);
        }

        .planet2 {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #6b9fff, #0e2a4a);
            bottom: 20%;
            left: 5%;
            animation: float 25s infinite ease-in-out reverse;
            box-shadow: 0 0 50px rgba(100, 150, 255, 0.12), 0 0 100px rgba(50,100,255,0.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, 
                transparent 0%, 
                rgba(0, 255, 200, 0.04) 25%, 
                rgba(200, 0, 255, 0.04) 50%, 
                rgba(0, 200, 255, 0.04) 75%, 
                transparent 100%);
            animation: aurora-flow 15s infinite linear;
            pointer-events: none;
        }

        @keyframes aurora-flow {
            0% { transform: translateX(-100%) rotate(0deg); }
            100% { transform: translateX(100%) rotate(360deg); }
        }

        /* Lime grid overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(200,255,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,255,0,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Komponen UI */
        .navbar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 1.1rem;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            color: var(--lime);
            background: transparent;
            padding: 6px 14px;
            border-radius: 0;
            border: 2px solid var(--border-strong);
            letter-spacing: -0.03em;
            text-shadow: 0 0 20px var(--lime-glow), 0 0 40px var(--lime-glow);
            box-shadow: 0 0 20px var(--lime-glow), inset 0 0 20px rgba(200,255,0,0.03);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo img {
            width: 20px;
            height: 20px;
            object-fit: cover;
            border-radius: 4px;
        }

        .nav-btn {
            background: var(--lime);
            border: 2px solid rgba(200,255,0,0.6);
            padding: 8px 14px;
            box-shadow: 4px 4px 0px rgba(200,255,0,0.3), 0 0 20px var(--lime-glow);
            font-size: 11px;
            cursor: pointer;
            color: #000;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            transition: all 0.1s;
        }

        .card {
            width: 100%;
            max-width: 420px;
            border: 2px solid var(--border-strong);
            box-shadow: var(--shadow);
            background: var(--surface);
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
            border-radius: 4px;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #1a0050 0%, #0d0030 60%, #080820 100%);
            padding: 22px 20px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(200,255,0,0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .plus { position: absolute; font-size: 16px; color: var(--lime); text-shadow: 0 0 10px var(--lime-glow); }
        .p-tl { top: 6px; left: 6px; }
        .p-tr { top: 6px; right: 6px; }
        .p-bl { bottom: 6px; left: 6px; }
        .p-br { bottom: 6px; right: 6px; }

        .profile-box { display: flex; align-items: center; gap: 14px; }
        
        .avatar {
            width: 55px;
            height: 55px;
            border: 2px solid var(--border-strong);
            border-radius: 8px;
            background: rgba(200,255,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px var(--lime-glow), inset 0 0 20px rgba(200,255,0,0.04);
        }
        .avatar i { color: var(--lime); font-size: 22px; text-shadow: 0 0 10px var(--lime-glow); }

        .header-text p { font-size: 10px; color: var(--lime); margin-bottom: 4px; text-shadow: 0 0 12px var(--lime-glow); letter-spacing: 0.1em; }
        .header-text h2 { font-size: 15px; line-height: 1.2; color: var(--text); font-family: 'Syne', sans-serif; font-weight: 900; letter-spacing: -0.02em; }

        .card-body { padding: 26px 22px; position: relative; background: var(--surface); }
        
        .label-input { display: block; font-size: 10px; margin-bottom: 8px; color: var(--lime); letter-spacing: 0.12em; text-transform: uppercase; text-shadow: 0 0 12px var(--lime-glow); }

        .main-input {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid var(--border);
            font-size: 13px;
            margin-bottom: 16px;
            outline: none;
            background: var(--surface2);
            color: var(--text);
            border-radius: 2px;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .main-input:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 20px var(--lime-glow), inset 0 0 10px rgba(200,255,0,0.03);
        }

        .main-input::placeholder { color: #3a3a4a; }

        .tags { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .tag {
            border: 1px solid var(--border);
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            background: var(--surface2);
            color: var(--text-dim);
            border-radius: 2px;
            letter-spacing: 0.06em;
            transition: all 0.15s;
        }
        .tag:hover { 
            background: rgba(200,255,0,0.08); 
            color: var(--lime); 
            border-color: var(--border-strong);
            text-shadow: 0 0 10px var(--lime-glow);
        }

        .btn-download {
            width: 100%;
            background: var(--lime);
            border: 2px solid rgba(200,255,0,0.6);
            padding: 15px;
            font-size: 14px;
            box-shadow: 0px 5px 0px rgba(100,130,0,0.7), 0 0 30px var(--lime-glow);
            cursor: pointer;
            transition: all 0.1s;
            margin-bottom: 12px;
            color: #000;
            border-radius: 2px;
            letter-spacing: 0.04em;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
        }

        /* Animasi klik button */
        .btn-click-animation {
            animation: btnPop 0.2s cubic-bezier(0.34, 1.2, 0.64, 1) forwards !important;
        }

        @keyframes btnPop {
            0% {
                transform: scale(1);
                box-shadow: 0px 5px 0px rgba(100,130,0,0.7), 0 0 30px var(--lime-glow);
            }
            50% {
                transform: scale(0.96);
                box-shadow: 0px 2px 0px rgba(100,130,0,0.7), 0 0 15px var(--lime-glow);
            }
            100% {
                transform: scale(1);
                box-shadow: 0px 5px 0px rgba(100,130,0,0.7), 0 0 30px var(--lime-glow);
            }
        }

        .btn-download:active {
            transform: translateY(3px);
            box-shadow: 0px 2px 0px rgba(100,130,0,0.7), 0 0 15px var(--lime-glow);
        }

        .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }

        #resultArea { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 18px; }
        .preview-box {
            width: 100%;
            border: 2px solid var(--border);
            margin-top: 14px;
            background: #000;
            border-radius: 2px;
            overflow: hidden;
        }
        .preview-box video, .preview-box img { width: 100%; display: block; }

        .dl-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 12px;
            border: 1px solid var(--border);
            margin-top: 8px;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 11px;
            background: var(--surface2);
            border-radius: 2px;
            transition: all 0.15s;
            letter-spacing: 0.06em;
        }
        .dl-item:hover { 
            background: rgba(200,255,0,0.08); 
            color: var(--lime); 
            border-color: var(--border-strong);
            box-shadow: 0 0 16px var(--lime-glow);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 11px;
            margin-top: 10px;
            text-align: center;
            letter-spacing: 0.04em;
        }

        .footer { 
            font-size: 10px; 
            margin-top: auto; 
            padding: 16px 20px; 
            position: relative; 
            z-index: 2; 
            color: var(--text-dim);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--surface);
        }
        .badge { 
            background: var(--lime); 
            color: #000; 
            padding: 3px 8px; 
            border-radius: 2px;
            box-shadow: 0 0 16px var(--lime-glow);
        }

        .loader {
            display: none;
            text-align: center;
            font-size: 11px;
            margin: 10px 0;
            color: var(--lime);
            letter-spacing: 0.1em;
            text-shadow: 0 0 12px var(--lime-glow);
        }

        #resTitle {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>

    <!-- Background Elements dari getcodr.html -->
    <div class="galaxy-bg"></div>
    <div class="stars" id="stars"></div>
    <div class="planet planet1"></div>
    <div class="planet planet2"></div>
    <div class="aurora"></div>

    <header class="navbar">
        <h1 class="logo">
            <img src="https://www.gobox.my.id/file/IcHjU.png" alt="icon">
            HidzDownloader
        </h1>
    </header>

    <div class="card">
        <div class="card-header">
            <span class="plus p-tl">+</span>
            <span class="plus p-tr">+</span>
            <div class="profile-box">
                <div class="avatar"><i class="fas fa-user-ninja"></i></div>
                <div class="header-text">
                    <p>Hidz Bilang</p>
                    <h2>TEMPEL LINK NYA<br>DIBAWAH YO</h2>
                </div>
            </div>
        </div>

        <div class="card-body">
            <label class="label-input">TARGET URL:</label>
            <input type="text" id="urlInput" class="main-input" placeholder="paste link disini">
            
            <div class="tags">
                <div class="tag" onclick="setEx('https://open.spotify.com/track/...')">#SPOTIFY</div>
                <div class="tag" onclick="setEx('https://vt.tiktok.com/...')">#TIKTOK</div>
                <div class="tag" onclick="setEx('https://www.instagram.com/...')">#IG</div>
                <div class="tag" onclick="setEx('https://www.youtube.com/...')">#YT</div>
                <div class="tag" onclick="setEx('https://facebook.com/...')">#FB</div>
                <div class="tag" onclick="setEx('https://x.com/...')">#X</div>
            </div>

            <button id="btnDownload" onclick="handleDownload()" class="btn-download">
                DOWNLOAD SEKARANG HEHE
            </button>

            <div id="loader" class="loader"> SABAR DULU LAGI CARI VT NYA</div>
            <div id="errorBox" class="error-msg"></div>

            <!-- Result Section -->
            <div id="resultArea" style="display:none;">
                <p id="resTitle" style="font-size: 12px; margin-bottom: 10px;"></p>
                <div id="previewContainer" class="preview-box"></div>
                <div id="downloadLinks" style="margin-top:15px;"></div>
            </div>

            <span class="plus p-bl">+</span>
            <span class="plus p-br">+</span>
        </div>
    </div>

    <footer class="footer">
        POWERED BY <span class="badge">HidzForum</span>
    </footer>

    <script>
        // Generate stars function dari getcodr.html
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Animasi klik pada button (tanpa mengubah teks)
        function addButtonClickAnimation(buttonElement) {
            if (!buttonElement) return;
            buttonElement.classList.remove('btn-click-animation');
            void buttonElement.offsetWidth;
            buttonElement.classList.add('btn-click-animation');
            setTimeout(() => {
                buttonElement.classList.remove('btn-click-animation');
            }, 200);
        }

        // Fungsi Set Contoh Link (TIDAK BERUBAH)
        function setEx(url) {
            document.getElementById('urlInput').value = url;
        }

        // === SPOTIFY SCRAPER (dari code.js, dikonversi ke browser) ===
        function isSpotifyUrl(url) {
            return url.includes('open.spotify.com') || url.includes('spotify.com/track');
        }

        async function spotifyGetXsrf() {
            const PROXY = 'https://corsproxy.io/?';
            const BASE = 'https://spotmate.online';
            const res = await fetch(PROXY + encodeURIComponent(BASE + '/en1'));
            const html = await res.text();
            const match = html.match(/<meta\s+name="csrf-token"\s+content="([^"]+)"/i);
            if (match) return match[1];
            const xsrfMatch = html.match(/XSRF-TOKEN[=:]\s*["']?([a-zA-Z0-9%|=+\/]+)/i);
            if (xsrfMatch) return decodeURIComponent(xsrfMatch[1]);
            throw new Error('Token keamanan tidak ditemukan');
        }

        async function convertSpotify(spotifyUrl) {
            const PROXY = 'https://corsproxy.io/?';
            const BASE = 'https://spotmate.online';
            const xsrf = await spotifyGetXsrf();

            const headers = {
                'Content-Type': 'application/json',
                'X-XSRF-TOKEN': xsrf,
                'Origin': BASE,
                'Referer': BASE + '/en1'
            };

            const trackRes = await fetch(PROXY + encodeURIComponent(BASE + '/getTrackData'), {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ spotify_url: spotifyUrl })
            });
            const t = await trackRes.json();

            const convertRes = await fetch(PROXY + encodeURIComponent(BASE + '/convert'), {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ urls: spotifyUrl })
            });
            const d = await convertRes.json();

            return {
                title: t.name || 'Unknown Track',
                artist: t.artists ? t.artists.map(a => a.name).join(', ') : 'Unknown',
                duration: t.duration_ms
                    ? Math.floor(t.duration_ms / 60000) + ':' + String(Math.floor((t.duration_ms % 60000) / 1000)).padStart(2, '0')
                    : '0:00',
                explicit: t.explicit || false,
                thumbnail: (t.album && t.album.images && t.album.images[0]) ? t.album.images[0].url : null,
                spotify_url: (t.external_urls && t.external_urls.spotify) ? t.external_urls.spotify : spotifyUrl,
                download_url: d.url || null
            };
        }

        // Fungsi Download dengan API ASLI (TIDAK BERUBAH) + Spotify route
        async function handleDownload() {
            const btn = document.getElementById('btnDownload');
            addButtonClickAnimation(btn);
            
            const urlInput = document.getElementById('urlInput').value.trim();
            const loader = document.getElementById('loader');
            const errorBox = document.getElementById('errorBox');
            const resultArea = document.getElementById('resultArea');
            const dlLinks = document.getElementById('downloadLinks');
            const preview = document.getElementById('previewContainer');

            if (!urlInput) {
                errorBox.innerText = "ISI DULU LINK NYA";
                return;
            }

            errorBox.innerText = "";
            resultArea.style.display = "none";
            loader.style.display = "block";
            btn.disabled = true;

            try {
                if (isSpotifyUrl(urlInput)) {
                    // === SPOTIFY DOWNLOAD ===
                    const result = await convertSpotify(urlInput);

                    document.getElementById('resTitle').innerText = result.title + ' - ' + result.artist;
                    preview.innerHTML = result.thumbnail
                        ? '<img src="' + result.thumbnail + '" alt="Album Art">'
                        : '';

                    dlLinks.innerHTML = '';

                    var info = document.createElement('div');
                    info.className = 'dl-item';
                    info.style.cursor = 'default';
                    info.innerHTML = '<span><i class="fab fa-spotify" style="color:#1DB954;"></i> ' + result.duration + (result.explicit ? ' [E]' : '') + '</span>';
                    dlLinks.appendChild(info);

                    if (result.download_url) {
                        var dlBtn = document.createElement('a');
                        dlBtn.href = result.download_url;
                        dlBtn.target = '_blank';
                        dlBtn.className = 'dl-item';
                        dlBtn.innerHTML = '<span>MP3 - DOWNLOAD</span> <i class="fas fa-download"></i>';
                        dlLinks.appendChild(dlBtn);
                    }

                    resultArea.style.display = 'block';

                } else {
                    // API TIDAK DIUBAH SAMA SEKALI
                    const response = await axios.post('https://auto-download-all-in-one.p.rapidapi.com/v1/social/autolink', 
                        { url: urlInput },
                        {
                            headers: {
                                'content-type': 'application/json',
                                'x-rapidapi-host': 'auto-download-all-in-one.p.rapidapi.com',
                                'x-rapidapi-key': 'ca5c6d6fa3mshfcd2b0a0feac6b7p140e57jsn72684628152a'
                            }
                        }
                    );

                    const data = response.data;
                    if (!data || data.error) throw new Error("Link tidak didukung atau error.");

                    document.getElementById('resTitle').innerText = data.title || "Media Found";
                    preview.innerHTML = "";
                    
                    if (data.medias && data.medias.length > 0) {
                        const first = data.medias[0];
                        if (first.extension === 'mp4' || first.url.includes('video')) {
                            preview.innerHTML = `<video controls><source src="${first.url}" type="video/mp4"></video>`;
                        } else {
                            preview.innerHTML = `<img src="${data.thumbnail || first.url}">`;
                        }

                        dlLinks.innerHTML = "";
                        data.medias.forEach(m => {
                            const a = document.createElement('a');
                            a.href = m.url;
                            a.target = "_blank";
                            a.className = "dl-item";
                            a.innerHTML = `<span>${m.extension.toUpperCase()} - ${m.quality || 'HD'}</span> <i class="fas fa-download"></i>`;
                            dlLinks.appendChild(a);
                        });
                    }

                    resultArea.style.display = "block";
                }

            } catch (err) {
                errorBox.innerText = "Gagal mengambil data. Periksa kembali link Anda.";
                console.error(err);
            } finally {
                loader.style.display = "none";
                btn.disabled = false;
                // Pastikan teks tombol KEMBALI KE ASLI (tidak berubah)
                if (btn.innerText !== "DOWNLOAD SEKARANG HEHE") {
                    btn.innerText = "DOWNLOAD SEKARANG HEHE";
                }
            }
        }

        // Initialize stars
        createStars();
    </script>
</body>
</html>
